<!doctype html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ÆtherSky · 商務艙雷達</title>
  <meta name="description" content="ÆtherSky — daily cheap business-class fares from Taipei and nearby ex-stations, real-time price trackers and a frequent-flyer wallet. China / Hong Kong / Macau carriers and connections excluded. SkyTeam first.">
  <meta name="theme-color" content="#0b1120" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <!-- Daily fare data is read from the public GitHub repo so the hosted app never needs a redeploy for new data. -->
  <meta name="bct-data-url" content="https://raw.githubusercontent.com/seanx888/aethersky/main/web/data/">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ÆtherSky">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icons/icon.svg" alt="" width="28" height="28">
      <h1 id="app-name">ÆtherSky</h1>
      <small id="app-sub">商務艙雷達</small>
    </div>
    <button id="install-btn" class="icon-btn" hidden aria-label="安裝 App"></button>
    <button id="refresh-btn" class="icon-btn" aria-label="重新整理"></button>
  </header>

  <div class="banner-wrap" id="banner"></div>

  <main>
    <section id="view-deals" class="view"><div class="skeleton"></div></section>
    <section id="view-special" class="view" hidden></section>
    <section id="view-routes" class="view" hidden></section>
    <section id="view-flights" class="view" hidden></section>
    <section id="view-members" class="view" hidden></section>
    <section id="view-settings" class="view" hidden></section>
  </main>

  <nav class="tabbar" aria-label="Main">
    <button data-tab="deals" data-icon="airplane-tilt" aria-current="page"><span data-i18n="tabDeals">今日好價</span></button>
    <button data-tab="special" data-icon="globe-hemisphere-east"><span data-i18n="tabEx">特殊票價</span></button>
    <button data-tab="routes" data-icon="chart-line-up"><span data-i18n="tabRoutes">航線追蹤</span></button>
    <button data-tab="flights" data-icon="airplane-takeoff"><span data-i18n="tabFlights">我的航班</span></button>
    <button data-tab="members" data-icon="wallet"><span data-i18n="tabMembers">會員卡</span></button>
    <button data-tab="settings" data-icon="gear-six"><span data-i18n="tabSettings">設定</span></button>
  </nav>

  <div id="gate" class="gate" hidden></div>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
